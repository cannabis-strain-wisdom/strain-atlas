name: UNIFORM DETAIL CARDS CANDIDATE V1

on:
  push:
    branches:
      - candidate/uniform-detail-cards-v1-20260908
    paths:
      - .github/workflows/uniform-detail-cards-candidate-v1.yml

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard exact PUBLIC base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "34cd1e987da104dfd849317b2879902bd7e9ea9a" || { echo 'UNEXPECTED_CANDIDATE_BASE'; exit 75; }

      - name: Patch universal fixed detail cards
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const appPath='app.min.js';
          let app=fs.readFileSync(appPath,'utf8');
          const marker='data-csw-hidden-presentation-live-guard-v1';
          if(!app.includes(marker)) throw new Error('HIDDEN_GUARD_MARKER_NOT_FOUND');
          const start='\n\n;(()=>{"use strict";const e=document.getElementById("detail-shell");if(!e)return;const t="data-csw-hidden-presentation-live-guard-v1"';
          const idx=app.indexOf(start);
          if(idx<0) throw new Error('HIDDEN_GUARD_BLOCK_START_NOT_FOUND');
          if(app.indexOf(marker,app.indexOf(marker)+1)>=0) throw new Error('HIDDEN_GUARD_MARKER_NOT_UNIQUE');
          const suffix=app.slice(idx);
          if(!suffix.trim().endsWith('})();')) throw new Error('HIDDEN_GUARD_NOT_TRAILING_BLOCK');
          app=app.slice(0,idx).replace(/\s+$/,'')+'\n';
          fs.writeFileSync(appPath,app);

          const p='presentation-contract-v1.js';
          let src=fs.readFileSync(p,'utf8');
          if(src.includes('UNIVERSAL_FIXED_DETAIL_CARDS_V1')) throw new Error('FIXED_CARD_CONTRACT_ALREADY_PRESENT');
          src += String.raw`

;(()=>{
  'use strict';
  const CONTRACT='UNIVERSAL_FIXED_DETAIL_CARDS_V1';
  const shell=document.getElementById('detail-shell');
  if(!shell)return;
  const specs={
    aroma:{label:'香り',kicker:'AROMA / 香り',title:'香り情報は確認できていません',text:'現在の採用資料では、この品種に直接結びつく香りの記述を確認できていません。確認できない香りを親品種や一般的な傾向から推測して補うことはしていません。'},
    terpene:{label:'テルペン',kicker:'TERPENE DATA / テルペン',title:'テルペン情報は確認できていません',text:'現在の採用資料では、この品種に直接結びつく個別テルペンの分析値・成分一覧を確認できていません。香りや他品種の情報から推測して補うことはしていません。'},
    morphology:{label:'形態',kicker:'MORPHOLOGY / 形態',title:'形態情報は確認できていません',text:'現在の採用資料では、この品種の株姿や花の形態を、品種固有の情報として十分に確認できていません。画像や近縁品種から推測して補うことはしていません。'},
    'origin-history':{label:'起源と歴史',kicker:'ORIGIN & HISTORY / 起源と歴史',title:'起源・歴史情報は確認できていません',text:'現在の採用資料では、この品種の起源や歴史を十分に確認できていません。未確認の年代・場所・由来を補って表示することはしていません。'}
  };
  const order=['aroma','terpene','morphology','origin-history','positioning'];
  function bind(root,button,panel){
    if(button.dataset.fixedDetailCardBound===CONTRACT)return;
    button.dataset.fixedDetailCardBound=CONTRACT;
    button.addEventListener('click',event=>{
      event.preventDefault();
      const open=button.getAttribute('aria-expanded')==='true'&&!panel.hidden;
      root.querySelectorAll('[data-ucd-tab]').forEach(item=>{item.setAttribute('aria-expanded','false');item.classList.remove('is-active')});
      root.querySelectorAll('[data-ucd-panel]').forEach(item=>{item.hidden=true});
      if(!open){button.setAttribute('aria-expanded','true');button.classList.add('is-active');panel.hidden=false;}
    });
  }
  function ensure(root,nav,panels,kind){
    if(nav.querySelector('[data-ucd-tab="'+kind+'"]')&&panels.querySelector('[data-ucd-panel="'+kind+'"]'))return false;
    const spec=specs[kind];
    const id='ucd-'+root.dataset.publicDetailId+'-'+kind;
    let button=nav.querySelector('[data-ucd-tab="'+kind+'"]');
    let panel=panels.querySelector('[data-ucd-panel="'+kind+'"]');
    if(!button){
      button=document.createElement('button');button.type='button';button.dataset.ucdTab=kind;button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls',id);
      const span=document.createElement('span');span.textContent=spec.label;const chevron=document.createElement('i');chevron.setAttribute('aria-hidden','true');chevron.textContent='⌄';button.append(span,chevron);
    }
    if(!panel){
      panel=document.createElement('section');panel.id=id;panel.dataset.ucdPanel=kind;panel.dataset.profileKind=kind;panel.dataset.unavailableDetailCard='v1';panel.hidden=true;
      const box=document.createElement('div');box.className='ucd-terpene-unavailable ucd-data-unavailable';const kicker=document.createElement('small');kicker.textContent=spec.kicker;const heading=document.createElement('strong');heading.textContent=spec.title;const text=document.createElement('p');text.textContent=spec.text;box.append(kicker,heading,text);panel.append(box);
    }
    nav.append(button);panels.append(panel);bind(root,button,panel);return true;
  }
  function reorder(nav,panels){
    for(const kind of order){const button=nav.querySelector('[data-ucd-tab="'+kind+'"]');const panel=panels.querySelector('[data-ucd-panel="'+kind+'"]');if(button)nav.append(button);if(panel)panels.append(panel);}
  }
  function decorate(){
    const root=shell.querySelector('.detail-public-v1[data-public-detail-id],.ucd-root[data-public-detail-id]');
    if(!root||root.dataset.publicPresentationReady!=='true')return false;
    const profile=root.querySelector('.ucd-profile'),nav=profile?.querySelector('.ucd-profile-nav'),panels=profile?.querySelector('.ucd-profile-panels');
    if(!(profile&&nav&&panels))return false;
    for(const kind of Object.keys(specs))ensure(root,nav,panels,kind);
    reorder(nav,panels);nav.dataset.count=String(nav.querySelectorAll('[data-ucd-tab]').length);root.dataset.fixedDetailCardsV1='true';return true;
  }
  let queued=false;const schedule=()=>{if(queued)return;queued=true;queueMicrotask(()=>requestAnimationFrame(()=>{queued=false;decorate()}));};
  new MutationObserver(schedule).observe(shell,{childList:true,subtree:true});shell.addEventListener('click',schedule,true);window.addEventListener('popstate',schedule);schedule();setTimeout(schedule,250);setTimeout(schedule,1000);
})();
`;
          fs.writeFileSync(p,src);
          NODE

          cat > .github/scripts/public-detail-card-uniformity-v1.mjs <<'NODE'
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const baseUrl=process.env.CSW_BASE_URL||'http://127.0.0.1:4173/';
          const chrome=process.env.CHROME_BIN;if(!chrome)throw new Error('CHROME_BIN is required');
          const profile=fs.mkdtempSync(path.join(os.tmpdir(),'csw-card-uniformity-'));
          const proc=spawn(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--remote-debugging-port=9223',`--user-data-dir=${profile}`,'about:blank'],{stdio:['ignore','pipe','pipe']});
          let stderr='';proc.stderr.on('data',d=>stderr+=String(d));
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function json(url){const r=await fetch(url);if(!r.ok)throw new Error(`${url} HTTP ${r.status}`);return r.json();}
          async function waitFor(fn,label,timeout=15000){const t=Date.now();let last;while(Date.now()-t<timeout){try{last=await fn();if(last)return last}catch(e){last=e}await sleep(100)}throw new Error(`Timeout ${label}${last instanceof Error?`: ${last.message}`:''}`)}
          class CDP{constructor(url){this.ws=new WebSocket(url);this.id=0;this.pending=new Map();this.exceptions=[]}async open(){await new Promise((res,rej)=>{this.ws.addEventListener('open',res,{once:true});this.ws.addEventListener('error',rej,{once:true})});this.ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(m.id){const p=this.pending.get(m.id);if(!p)return;this.pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result)}else if(m.method==='Runtime.exceptionThrown')this.exceptions.push(m)})}send(method,params={}){const id=++this.id;return new Promise((resolve,reject)=>{this.pending.set(id,{resolve,reject});this.ws.send(JSON.stringify({id,method,params}))})}close(){this.ws.close()}}
          async function main(){
            await waitFor(async()=>{try{return await json('http://127.0.0.1:9223/json/version')}catch{return false}},'Chrome DevTools');
            const pages=await json('http://127.0.0.1:9223/json/list');const page=pages.find(x=>x.type==='page');if(!page)throw new Error('No page target');
            const cdp=new CDP(page.webSocketDebuggerUrl);await cdp.open();await cdp.send('Page.enable');await cdp.send('Runtime.enable');
            async function evalv(expression){const r=await cdp.send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw new Error(`Eval exception: ${r.exceptionDetails.text}`);return r.result.value}
            const catalog=await json(new URL('runtime/catalog.json',baseUrl));const ids=(catalog.cultivars||[]).map(x=>x.id);if(!ids.length)throw new Error('No cultivars');
            const failures=[];
            for(const id of ids){
              cdp.exceptions.length=0;await cdp.send('Page.navigate',{url:`${baseUrl}?strain=${encodeURIComponent(id)}`});
              await waitFor(()=>evalv(`document.readyState==='complete'`),`${id} document`);
              await waitFor(()=>evalv(`(()=>{const r=document.querySelector('.detail-public-v1[data-public-detail-id=${JSON.stringify(id)}],.ucd-root[data-public-detail-id=${JSON.stringify(id)}]');return !!r&&r.dataset.fixedDetailCardsV1==='true'})()`),`${id} fixed cards`,20000);
              const state=await evalv(`(()=>{const r=document.querySelector('.detail-public-v1[data-public-detail-id=${JSON.stringify(id)}],.ucd-root[data-public-detail-id=${JSON.stringify(id)}]');return {lineage:!!r?.querySelector('.ucd-lineage'),type:!!r?.querySelector('[data-ucd-primary-tab="type"],.ucd-type-only,.ucd-ratio-card'),cannabinoid:!!r?.querySelector('[data-ucd-primary-tab="cannabinoid"],.ucd-cannabinoid-card'),aroma:!!r?.querySelector('[data-ucd-tab="aroma"]'),terpene:!!r?.querySelector('[data-ucd-tab="terpene"]'),morphology:!!r?.querySelector('[data-ucd-tab="morphology"]'),originHistory:!!r?.querySelector('[data-ucd-tab="origin-history"]'),overflow:r? r.scrollWidth>r.clientWidth+1:true}})()`);
              const missing=Object.entries(state).filter(([k,v])=>k!=='overflow'&&!v).map(([k])=>k);if(state.overflow)missing.push('horizontalOverflow');if(cdp.exceptions.length)missing.push(`runtimeExceptions:${cdp.exceptions.length}`);if(missing.length)failures.push({id,missing,state});
            }
            cdp.close();if(failures.length)throw new Error(`UNIFORM_DETAIL_CARD_FAILURES ${JSON.stringify(failures)}`);console.log(`UNIFORM DETAIL CARDS PASS ${ids.length}/${ids.length}`);
          }
          try{await main()}finally{proc.kill('SIGTERM');fs.rmSync(profile,{recursive:true,force:true})}
          NODE

          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-public-ui-pages.yml')
          s=p.read_text()
          old="CHROME_BIN=\"$CHROME_BIN\" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs\n          echo \"PUBLIC FRONTEND BROWSER SMOKE PASS\""
          new="CHROME_BIN=\"$CHROME_BIN\" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs\n          CHROME_BIN=\"$CHROME_BIN\" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-card-uniformity-v1.mjs\n          echo \"PUBLIC FRONTEND BROWSER SMOKE PASS\""
          if s.count(old)!=1: raise SystemExit('local browser smoke insertion point mismatch')
          s=s.replace(old,new)
          old2="CHROME_BIN=\"$CHROME_BIN\" CSW_BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas/' node .github/scripts/public-frontend-browser-smoke-v2.mjs\n          echo \"PUBLIC LIVE BROWSER SMOKE PASS\""
          new2="CHROME_BIN=\"$CHROME_BIN\" CSW_BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas/' node .github/scripts/public-frontend-browser-smoke-v2.mjs\n          CHROME_BIN=\"$CHROME_BIN\" CSW_BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas/' node .github/scripts/public-detail-card-uniformity-v1.mjs\n          echo \"PUBLIC LIVE BROWSER SMOKE PASS\""
          if s.count(old2)!=1: raise SystemExit('live browser smoke insertion point mismatch')
          p.write_text(s.replace(old2,new2))
          PY

      - name: Validate candidate against all 51 public cultivars
        shell: bash
        run: |
          set -euo pipefail
          node --check app.min.js
          node --check presentation-contract-v1.js
          node --check .github/scripts/public-detail-card-uniformity-v1.mjs
          ! grep -Fq 'data-csw-hidden-presentation-live-guard-v1' app.min.js
          grep -Fq 'UNIVERSAL_FIXED_DETAIL_CARDS_V1' presentation-contract-v1.js
          CHROME_BIN="${CHROME_BIN:-$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)}"
          test -n "$CHROME_BIN"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/csw-uniform-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-card-uniformity-v1.mjs

      - name: Commit clean validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git rm .github/workflows/uniform-detail-cards-candidate-v1.yml
          git add app.min.js presentation-contract-v1.js .github/scripts/public-detail-card-uniformity-v1.mjs .github/workflows/deploy-public-ui-pages.yml
          mapfile -t paths < <(git diff --cached --name-only)
          printf '%s\n' "${paths[@]}"
          for p in "${paths[@]}"; do case "$p" in app.min.js|presentation-contract-v1.js|.github/scripts/public-detail-card-uniformity-v1.mjs|.github/workflows/deploy-public-ui-pages.yml|.github/workflows/uniform-detail-cards-candidate-v1.yml) ;; *) echo "UNEXPECTED_PATH:$p"; exit 1;; esac; done
          git commit -m "Restore uniform cultivar detail cards"
          git push origin HEAD:candidate/uniform-detail-cards-v1-20260908
