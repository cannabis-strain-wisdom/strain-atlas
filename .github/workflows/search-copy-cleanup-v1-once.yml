name: Search copy cleanup V1 once

on:
  push:
    branches:
      - validated/search-copy-cleanup-v1
    paths:
      - .github/workflows/search-copy-cleanup-v1-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          expected='ca30e2d709e720136c93920055dc294a741d57f3'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "SAFE_STOP_BASE_MISMATCH expected=$expected actual=$actual" >&2; exit 42; }

      - name: Apply copy-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<span class="filter-summary-label">さらに検索</span>', '<span class="filter-summary-label">詳細フィルター</span>'),
              ('<div class="filter-group-heading"><span>BREEDER</span><h3>Breeder</h3></div>', '<div class="filter-group-heading"><span>BREEDER</span><h3>ブリーダー</h3></div>'),
              ('<label class="sr-only" for="breeder-filter">Breederで絞り込む</label>', '<label class="sr-only" for="breeder-filter">ブリーダーで絞り込む</label>'),
              ('<select class="breeder-select" id="breeder-filter"><option value="">すべてのBreeder</option></select>', '<select class="breeder-select" id="breeder-filter"><option value="">すべてのブリーダー</option></select>'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'SAFE_STOP_COPY_MATCH_COUNT:{old}:{count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq '<span class="filter-summary-label">詳細フィルター</span>' index.html
          grep -Fq '<span>BREEDER</span><h3>ブリーダー</h3>' index.html
          grep -Fq '>すべてのブリーダー</option>' index.html
          ! grep -Fq '<span class="filter-summary-label">さらに検索</span>' index.html
          ! grep -Fq '<span>BREEDER</span><h3>Breeder</h3>' index.html

      - name: Browser regression before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/csw-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'SAFE_STOP_CHROME_NOT_FOUND' >&2; exit 45; }
          export CHROME_BIN
          export CSW_BASE_URL='http://127.0.0.1:4173/'
          node .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Commit exact validated delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cannabis-strain-wisdom'
          git config user.email '316430215+cannabis-strain-wisdom@users.noreply.github.com'
          git rm .github/workflows/search-copy-cleanup-v1-once.yml
          git add index.html
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/search-copy-cleanup-v1-once.yml' 'index.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Clean up search filter labels'
          git push origin HEAD:validated/search-copy-cleanup-v1
