name: Search copy runtime fix V1 once

on:
  push:
    branches:
      - validated/search-copy-runtime-fix-v1
    paths:
      - .github/workflows/search-copy-runtime-fix-v1-once.yml

permissions:
  contents: write

concurrency:
  group: csw-search-copy-runtime-fix-v1-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='dda61af0ea463a58b3aa98600d12dbb0b1db60cc'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || {
            echo "SAFE_STOP_EXPECTED_PARENT_MISMATCH expected=$expected_parent actual=$actual_parent" >&2
            exit 42
          }
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = '.github/workflows/search-copy-runtime-fix-v1-once.yml' || {
            echo "SAFE_STOP_CREATION_SCOPE_MISMATCH files=$changed" >&2
            exit 43
          }

      - name: Apply one runtime copy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app.min.js')
          text = path.read_text(encoding='utf-8')
          old = '<option value="">すべてのBreeder</option>'
          new = '<option value="">すべてのブリーダー</option>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'SAFE_STOP_RUNTIME_BREEDER_MATCH_COUNT:{count}')
          text = text.replace(old, new, 1)
          if old in text:
              raise SystemExit('SAFE_STOP_RUNTIME_BREEDER_OLD_REMAINS')
          path.write_text(text, encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          required = [
              '詳細フィルター',
              '<span>BREEDER</span><h3>ブリーダー</h3>',
              'ブリーダーで絞り込む',
              'すべてのブリーダー',
          ]
          missing = [item for item in required if item not in index]
          if missing:
              raise SystemExit(f'SAFE_STOP_INDEX_COPY_MISSING:{missing}')
          PY
          node --check app.min.js
          grep -Fq 'すべてのブリーダー' app.min.js
          if grep -Fq 'すべてのBreeder' app.min.js; then
            echo 'SAFE_STOP_RUNTIME_OLD_COPY_PRESENT' >&2
            exit 44
          fi

      - name: Browser regression before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/csw-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'SAFE_STOP_CHROME_NOT_FOUND' >&2; exit 45; }
          export CHROME_BIN
          export CSW_BASE_URL='http://127.0.0.1:4173/'
          node .github/scripts/public-frontend-browser-smoke-v2.mjs
          grep -Fq 'すべてのブリーダー' app.min.js

      - name: Commit exact validated delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cannabis-strain-wisdom'
          git config user.email '316430215+cannabis-strain-wisdom@users.noreply.github.com'
          git rm .github/workflows/search-copy-runtime-fix-v1-once.yml
          git add app.min.js
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/search-copy-runtime-fix-v1-once.yml' 'app.min.js' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Fix breeder filter runtime label'
          git push origin HEAD:validated/search-copy-runtime-fix-v1
