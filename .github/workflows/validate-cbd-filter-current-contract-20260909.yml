name: VALIDATE CURRENT CONTRACT CBD FILTER 20260909

on:
  push:
    branches:
      - "ops/cbd-filter-current-contract-20260909"
    paths:
      - ".github/workflows/validate-cbd-filter-current-contract-20260909.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/cbd-filter-current-contract-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded CBD category filter patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.min.js')
          s=p.read_text()
          old='catOk=(e,t)=>{if("cbd"===t){const i=e?.cannabinoids?.cbd;if("confirmed"!==i?.status)return!1;const a=i.measurement;if(!a)return!1;const n="range"===a.kind?Number(a.min):"single"===a.kind?Number(a.value):NaN;return Number.isFinite(n)&&n>=5}return"landrace"===t&&/\\blandrace\\b/i.test(G([e?.breeding?.method,e?.lineage?.note]).join(" "))}'
          new='catOk=(e,t)=>{if("cbd"===t){const i=e?.cannabinoids?.cbd;if("confirmed"===i?.status){const t=i.measurement,a="range"===t?.kind?Number(t.min):"single"===t?.kind?Number(t.value):NaN;if(Number.isFinite(a)&&a>=5)return!0}for(const t of e?.cannabinoids?.presentation?.items||[]){if("ANALYTE"!==t?.targetType||"CBD"!==t?.targetId||"SOURCE_DECLARED_NUMERIC"!==t?.evidenceType||"cultivar"!==t?.evidenceScope)continue;const i="range"===t?.valueKind?Number(t.minValue):"exact"===t?.valueKind?Number(t.value):NaN;if(Number.isFinite(i)&&i>=5)return!0}return!1}return"landrace"===t&&/\\blandrace\\b/i.test(G([e?.breeding?.method,e?.lineage?.note]).join(" "))}'
          if s.count(old)!=1:
              raise SystemExit(f'EXPECTED_ONE_CBD_FILTER_MATCH:{s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check app.min.js
          grep -Fq '"SOURCE_DECLARED_NUMERIC"!==t?.evidenceType' app.min.js
          grep -Fq '"cultivar"!==t?.evidenceScope' app.min.js
          rm .github/workflows/validate-cbd-filter-current-contract-20260909.yml
          git diff --check
      - name: Run current PUBLIC browser regression suite
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="${CHROME_BIN:-}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)"
          fi
          test -n "$CHROME_BIN"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/csw-http.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/runtime/catalog.json >/dev/null
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-current-runtime-authority-v1.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-card-uniformity-v1.mjs
      - name: Commit validated one-file frontend patch
        shell: bash
        run: |
          set -euo pipefail
          git add app.min.js .github/workflows/validate-cbd-filter-current-contract-20260909.yml
          mapfile -t paths < <(git diff --cached --name-only | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = ".github/workflows/validate-cbd-filter-current-contract-20260909.yml"
          test "${paths[1]}" = "app.min.js"
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git commit -m "Support current-contract CBD category filtering"
          git push origin HEAD:ops/cbd-filter-current-contract-20260909
