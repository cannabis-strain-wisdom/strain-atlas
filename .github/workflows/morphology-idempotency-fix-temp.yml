name: Fix Morphology presentation idempotency once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/morphology-idempotency-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PUBLIC main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Morphology idempotency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('presentation-contract-v1.js')
          s=p.read_text()
          old="if(!(root&&profile&&nav&&panels)){window.__CSWMorphologyPresentationV1={status:'FAIL_CLOSED',error:`MORPHOLOGY_CONTEXT_MISSING:${id}`};return}let button=nav.querySelector('[data-ucd-tab=\"morphology\"]'),panel=panels.querySelector('[data-ucd-panel=\"morphology\"]');"
          new="if(!(root&&profile&&nav&&panels)){window.__CSWMorphologyPresentationV1={status:'FAIL_CLOSED',error:`MORPHOLOGY_CONTEXT_MISSING:${id}`};return}if(root.dataset.morphologyPresentationReady==='v1'&&nav.querySelector('[data-ucd-tab=\"morphology\"]')&&panels.querySelector('[data-ucd-panel=\"morphology\"]'))return;let button=nav.querySelector('[data-ucd-tab=\"morphology\"]'),panel=panels.querySelector('[data-ucd-panel=\"morphology\"]');"
          if old not in s:
              raise SystemExit('MORPHOLOGY_IDEMPOTENCY_PATCH_TARGET_MISSING')
          p.write_text(s.replace(old,new,1))
          PY
          node --check presentation-contract-v1.js
          grep -Fq "morphologyPresentationReady==='v1'" presentation-contract-v1.js
          git diff --check

      - name: Commit durable fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/morphology-idempotency-fix-temp.yml
          git add presentation-contract-v1.js
          git diff --cached --check
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git commit -m "Make Morphology presentation idempotent"
          git fetch origin main
          git push origin HEAD:main
