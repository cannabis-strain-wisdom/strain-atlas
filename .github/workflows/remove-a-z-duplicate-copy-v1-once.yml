name: Remove A-Z duplicate copy V1 once

on:
  push:
    branches:
      - validated/remove-a-z-duplicate-copy-v1
    paths:
      - .github/workflows/remove-a-z-duplicate-copy-v1-once.yml

permissions:
  contents: write

concurrency:
  group: csw-remove-a-z-duplicate-copy-v1-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='074a49ee608abda19d4a82f2dfd9f7e47114128b'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || {
            echo "SAFE_STOP_EXPECTED_PARENT_MISMATCH expected=$expected_parent actual=$actual_parent" >&2
            exit 42
          }
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = '.github/workflows/remove-a-z-duplicate-copy-v1-once.yml' || {
            echo "SAFE_STOP_CREATION_SCOPE_MISMATCH files=$changed" >&2
            exit 43
          }

      - name: Remove only visible duplicate A-Z copy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '''        <section class="alphabet-browse" aria-labelledby="alphabet-title">\n          <div class="alphabet-browse-heading"><span>A-Z BROWSE</span><strong id="alphabet-title">品種名から探す</strong></div>'''
          new = '''        <section class="alphabet-browse" aria-label="品種名の頭文字から探す">\n          <div class="alphabet-browse-heading"><span>A-Z BROWSE</span></div>'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'SAFE_STOP_AZ_COPY_MATCH_COUNT:{count}')
          text = text.replace(old, new, 1)
          if '>品種名から探す<' in text:
              raise SystemExit('SAFE_STOP_VISIBLE_AZ_DUPLICATE_REMAINS')
          if 'aria-label="品種名の頭文字から探す"' not in text:
              raise SystemExit('SAFE_STOP_AZ_ACCESSIBLE_LABEL_MISSING')
          path.write_text(text, encoding='utf-8')
          PY
          grep -Fq '<div class="alphabet-browse-heading"><span>A-Z BROWSE</span></div>' index.html
          grep -Fq 'aria-label="品種名の頭文字から探す"' index.html
          if grep -Fq '>品種名から探す<' index.html; then
            echo 'SAFE_STOP_VISIBLE_AZ_DUPLICATE_PRESENT' >&2
            exit 44
          fi

      - name: Browser regression before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/csw-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'SAFE_STOP_CHROME_NOT_FOUND' >&2; exit 45; }
          export CHROME_BIN
          export CSW_BASE_URL='http://127.0.0.1:4173/'
          node .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Commit exact validated delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cannabis-strain-wisdom'
          git config user.email '316430215+cannabis-strain-wisdom@users.noreply.github.com'
          git rm .github/workflows/remove-a-z-duplicate-copy-v1-once.yml
          git add index.html
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/remove-a-z-duplicate-copy-v1-once.yml' 'index.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Remove duplicate A-Z browse copy'
          git push origin HEAD:validated/remove-a-z-duplicate-copy-v1
