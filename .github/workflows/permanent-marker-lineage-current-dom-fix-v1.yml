name: Permanent Marker lineage current DOM fix V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/permanent-marker-lineage-current-dom-fix-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch current detail DOM decorator and browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          presentation = Path('presentation-contract-v1.js')
          s = presentation.read_text(encoding='utf-8')
          marker = 'PERMANENT_MARKER_LINEAGE_CURRENT_DOM_V1'
          if marker not in s:
              s += r'''

;(()=>{
  'use strict';
  const CONTRACT='PERMANENT_MARKER_LINEAGE_CURRENT_DOM_V1';
  const TARGET='permanent-marker';
  const shell=document.getElementById('detail-shell');
  if(!shell)return;
  let catalogPromise=null;
  const loadCatalog=()=>catalogPromise||(catalogPromise=window.__CSWRuntimeCatalogPromise?Promise.resolve(window.__CSWRuntimeCatalogPromise):fetch('runtime/catalog.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`catalog HTTP ${response.status}`);return response.json()}));
  const removeStale=()=>shell.querySelectorAll('[data-lineage-note-v1="true"]').forEach(note=>note.remove());
  const decorate=async()=>{
    const id=new URL(location.href).searchParams.get('strain');
    if(id!==TARGET){removeStale();return false;}
    const root=shell.querySelector(`.detail-public-v1[data-public-detail-id="${TARGET}"],.ucd-root[data-public-detail-id="${TARGET}"]`);
    const lineage=shell.querySelector('.ucd-lineage');
    if(!root||!lineage)return false;
    const catalog=await loadCatalog();
    const cultivar=(catalog?.cultivars||[]).find(item=>item?.id===TARGET);
    const noteText=String(cultivar?.publicContent?.ja?.lineageNote||cultivar?.lineage?.presentation?.textJa||'').trim();
    if(!cultivar||!noteText)throw new Error('PERMANENT_MARKER_LINEAGE_NOTE_DATA_MISSING');
    let note=shell.querySelector('[data-lineage-note-v1="true"]');
    if(!note){note=document.createElement('p');note.className='ucd-lineage-note-v1';note.dataset.lineageNoteV1='true'}
    if(note.textContent!==noteText)note.textContent=noteText;
    if(lineage.nextElementSibling!==note)lineage.insertAdjacentElement('afterend',note);
    [...lineage.querySelectorAll(':scope > div > p')].filter(item=>item.textContent.trim()===noteText).forEach(item=>item.remove());
    root.dataset.permanentMarkerLineageNote='v1';
    window.__CSWPermanentMarkerLineageCurrentDomV1={status:'PASS',contract:CONTRACT,cultivarId:TARGET};
    return true;
  };
  let queued=false;
  const schedule=()=>{if(queued)return;queued=true;queueMicrotask(()=>requestAnimationFrame(()=>{queued=false;decorate().catch(error=>{window.__CSWPermanentMarkerLineageCurrentDomV1={status:'FAIL_CLOSED',contract:CONTRACT,error:String(error?.message||error)};console.error(CONTRACT,error)})}))};
  new MutationObserver(schedule).observe(shell,{childList:true,subtree:true});
  shell.addEventListener('click',schedule,true);
  window.addEventListener('popstate',schedule);
  schedule();setTimeout(schedule,250);setTimeout(schedule,1000);
})();
'''
          presentation.write_text(s, encoding='utf-8')

          qa = Path('.github/scripts/public-frontend-browser-smoke-v2.mjs')
          q = qa.read_text(encoding='utf-8')
          old_wait = '''  await waitFor(() => evalv(`(()=>{const shell=document.querySelector('.detail-public-v1[data-public-detail-id="permanent-marker"]');const root=shell?.querySelector('.ucd-root[data-public-presentation-ready="true"]');return document.getElementById('detail-dialog').open===true && !!root?.querySelector('[data-lineage-note-v1="true"]')})()`), 'Permanent Marker inline lineage note');\n'''
          new_wait = '''  await waitFor(() => evalv(`(()=>{const root=document.querySelector('.detail-public-v1[data-public-detail-id="permanent-marker"],.ucd-root[data-public-detail-id="permanent-marker"]');const lineage=document.querySelector('#detail-shell .ucd-lineage');const note=document.querySelector('#detail-shell [data-lineage-note-v1="true"]');return document.getElementById('detail-dialog').open===true && !!root && !!lineage && !!note && lineage.nextElementSibling===note})()`), 'Permanent Marker inline lineage note');\n'''
          if old_wait not in q:
              raise SystemExit('Permanent Marker wait anchor missing')
          q = q.replace(old_wait, new_wait, 1)

          old_state = '''  const permanentMarkerLineage = await evalv(`(()=>{const root=document.querySelector('.detail-public-v1[data-public-detail-id="permanent-marker"]');const lineage=root?.querySelector('.ucd-lineage');const note=root?.querySelector('[data-lineage-note-v1="true"]');const noteText=note?.textContent?.trim()||'';const duplicate=[...lineage?.querySelectorAll(':scope > div > p')||[]].some(node=>node.textContent.trim()===noteText);return {noteText,directSibling:lineage?.nextElementSibling===note,duplicate,visible:note?getComputedStyle(note).display!=='none':false,horizontalOverflow:root.scrollWidth>root.clientWidth+1}})()`);\n'''
          new_state = '''  const permanentMarkerLineage = await evalv(`(()=>{const root=document.querySelector('.detail-public-v1[data-public-detail-id="permanent-marker"],.ucd-root[data-public-detail-id="permanent-marker"]');const shell=document.getElementById('detail-shell');const lineage=shell?.querySelector('.ucd-lineage');const note=shell?.querySelector('[data-lineage-note-v1="true"]');const noteText=note?.textContent?.trim()||'';const duplicate=[...lineage?.querySelectorAll(':scope > div > p')||[]].some(node=>node.textContent.trim()===noteText);return {noteText,directSibling:lineage?.nextElementSibling===note,duplicate,visible:note?getComputedStyle(note).display!=='none':false,marker:root?.dataset.permanentMarkerLineageNote||'',horizontalOverflow:(root?root.scrollWidth>root.clientWidth+1:true)||(shell?shell.scrollWidth>shell.clientWidth+1:true)}})()`);\n'''
          if old_state not in q:
              raise SystemExit('Permanent Marker state anchor missing')
          q = q.replace(old_state, new_state, 1)

          old_check = '''  if (!permanentMarkerLineage.directSibling || !permanentMarkerLineage.visible) throw new Error(`Permanent Marker lineage note placement invalid: ${JSON.stringify(permanentMarkerLineage)}`);\n'''
          new_check = '''  if (!permanentMarkerLineage.directSibling || !permanentMarkerLineage.visible || permanentMarkerLineage.marker !== 'v1') throw new Error(`Permanent Marker lineage note placement invalid: ${JSON.stringify(permanentMarkerLineage)}`);\n'''
          if old_check not in q:
              raise SystemExit('Permanent Marker placement check anchor missing')
          q = q.replace(old_check, new_check, 1)

          new_caledonia_anchor = '''  await waitFor(() => evalv(`document.getElementById('detail-dialog').open===true && document.querySelector('.detail-public-v1[data-public-detail-id="new-caledonia"]') && document.querySelector('.ucd-lineage summary strong')`), 'New Caledonia universal lineage');\n'''
          new_caledonia_replace = new_caledonia_anchor + '''  if (await evalv(`!!document.querySelector('#detail-shell [data-lineage-note-v1="true"]')`)) throw new Error('Permanent Marker lineage note leaked to New Caledonia');\n'''
          if new_caledonia_anchor not in q:
              raise SystemExit('New Caledonia scope guard anchor missing')
          q = q.replace(new_caledonia_anchor, new_caledonia_replace, 1)
          qa.write_text(q, encoding='utf-8')
          PY

          node --check presentation-contract-v1.js
          node --check .github/scripts/public-frontend-browser-smoke-v2.mjs
          grep -Fq 'PERMANENT_MARKER_LINEAGE_CURRENT_DOM_V1' presentation-contract-v1.js
          grep -Fq "shell.querySelector('.ucd-lineage')" presentation-contract-v1.js
          grep -Fq 'Permanent Marker lineage note leaked to New Caledonia' .github/scripts/public-frontend-browser-smoke-v2.mjs
          git diff --check
          git diff -- presentation-contract-v1.js .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "csw-public-presentation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add presentation-contract-v1.js .github/scripts/public-frontend-browser-smoke-v2.mjs
          git rm .github/workflows/permanent-marker-lineage-current-dom-fix-v1.yml
          git diff --cached --check
          git commit -m "Render Permanent Marker lineage note in current detail DOM"
          git push origin HEAD:main
