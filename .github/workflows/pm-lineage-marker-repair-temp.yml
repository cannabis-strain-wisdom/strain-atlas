name: PM Lineage Marker Repair TEMP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pm-lineage-marker-repair-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PUBLIC main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard expected parent
        shell: bash
        run: |
          set -euo pipefail
          expected='db23c97fa67ece98c48d4b9cf3917ca2f018b08d'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "Unexpected parent: $actual" >&2; exit 1; }

      - name: Restore consolidated Permanent Marker QA marker
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('presentation-contract-v1.js')
          text = path.read_text(encoding='utf-8')
          old = "root.dataset.lineageNoteVisible = 'v1';\n    return true;"
          new = "root.dataset.lineageNoteVisible = 'v1';\n    root.dataset.permanentMarkerLineageNote = 'v1';\n    return true;"
          assert text.count(old) == 1, f'unexpected marker insertion target count: {text.count(old)}'
          assert 'PERMANENT_MARKER_LINEAGE_CURRENT_DOM_V1' not in text
          text = text.replace(old, new, 1)
          assert text.count("root.dataset.permanentMarkerLineageNote = 'v1';") == 1
          path.write_text(text, encoding='utf-8')
          PY
          node --check presentation-contract-v1.js
          git diff --check

      - name: Commit marker repair and remove temporary writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'csw-presentation-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pm-lineage-marker-repair-temp.yml
          git add presentation-contract-v1.js
          git diff --cached --check
          paths="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/pm-lineage-marker-repair-temp.yml' 'presentation-contract-v1.js' | sort)"
          test "$paths" = "$expected" || { echo "Unexpected staged paths:" >&2; printf '%s\n' "$paths" >&2; exit 1; }
          git commit -m 'Restore Permanent Marker lineage QA marker'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$final_sha" || { echo "Remote main did not converge" >&2; exit 1; }
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-ui-pages.yml/dispatches \
            -d '{"ref":"main"}'
          echo "FINAL_PUBLIC_SHA=$final_sha"
