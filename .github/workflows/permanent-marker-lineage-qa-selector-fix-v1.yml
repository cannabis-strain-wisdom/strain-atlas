name: Permanent Marker lineage QA selector fix V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/permanent-marker-lineage-qa-selector-fix-v1.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix Permanent Marker QA selector only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/public-frontend-browser-smoke-v2.mjs')
          s = p.read_text(encoding='utf-8')
          old = """  await waitFor(() => evalv(`(()=>{const root=document.querySelector('.detail-public-v1[data-public-detail-id=\"permanent-marker\"]');return document.getElementById('detail-dialog').open===true && root?.dataset.publicPresentationReady==='true' && root.querySelector('[data-lineage-note-v1=\"true\"]')})()`), 'Permanent Marker inline lineage note');\n"""
          new = """  await waitFor(() => evalv(`(()=>{const shell=document.querySelector('.detail-public-v1[data-public-detail-id=\"permanent-marker\"]');const root=shell?.querySelector('.ucd-root[data-public-presentation-ready=\"true\"]');return document.getElementById('detail-dialog').open===true && !!root?.querySelector('[data-lineage-note-v1=\"true\"]')})()`), 'Permanent Marker inline lineage note');\n"""
          if old not in s:
              raise SystemExit('Permanent Marker QA selector anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check .github/scripts/public-frontend-browser-smoke-v2.mjs
          git diff --check
          git diff -- .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Commit QA selector fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "csw-public-presentation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/public-frontend-browser-smoke-v2.mjs
          git rm .github/workflows/permanent-marker-lineage-qa-selector-fix-v1.yml
          git diff --cached --check
          git commit -m "Fix Permanent Marker lineage QA selector"
          git push origin HEAD:main

      - name: Dispatch exact Pages validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-ui-pages.yml/dispatches \
            -d '{"ref":"main"}'
