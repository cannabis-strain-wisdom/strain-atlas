name: PM Lineage Blocker Repair TEMP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pm-lineage-blocker-repair-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PUBLIC main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard expected parent
        shell: bash
        run: |
          set -euo pipefail
          expected='5e1b773fe70669f987cb022c0e257a1778ab6941'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "Unexpected parent: $actual" >&2; exit 1; }

      - name: Repair only Permanent Marker lineage DOM scope
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('presentation-contract-v1.js')
          text = path.read_text(encoding='utf-8')

          old_lineage = "const lineage = root.querySelector('.ucd-lineage');"
          old_existing = "const existing = root.querySelector('[data-lineage-note-v1=\"true\"]');"
          old_guard = "!root.querySelector('[data-lineage-note-v1=\"true\"]')"
          marker = "\n;(()=>{\n  'use strict';\n  const CONTRACT='PERMANENT_MARKER_LINEAGE_CURRENT_DOM_V1';"

          assert text.count(old_lineage) == 1, f'unexpected stale lineage selector count: {text.count(old_lineage)}'
          assert text.count(old_existing) == 1, f'unexpected stale note selector count: {text.count(old_existing)}'
          assert text.count(old_guard) == 1, f'unexpected stale guard count: {text.count(old_guard)}'
          assert text.count(marker) == 1, f'unexpected duplicate patch marker count: {text.count(marker)}'

          text = text.replace(old_lineage, "const lineage = shell.querySelector('.ucd-lineage');", 1)
          text = text.replace(old_existing, "const existing = shell.querySelector('[data-lineage-note-v1=\"true\"]');", 1)
          text = text.replace(old_guard, "!shell.querySelector('[data-lineage-note-v1=\"true\"]')", 1)

          # The dedicated later IIFE was a recovery shim for the same DOM mismatch.
          # Once the shared presentation contract uses the real hero-side lineage DOM,
          # retaining both implementations would duplicate ownership of the same note.
          cut = text.index(marker)
          text = text[:cut].rstrip() + '\n'

          assert 'PERMANENT_MARKER_LINEAGE_CURRENT_DOM_V1' not in text
          assert "const lineage = shell.querySelector('.ucd-lineage');" in text
          assert "const existing = shell.querySelector('[data-lineage-note-v1=\"true\"]');" in text
          assert "!shell.querySelector('[data-lineage-note-v1=\"true\"]')" in text
          assert "const lineage = root.querySelector('.ucd-lineage');" not in text

          path.write_text(text, encoding='utf-8')
          PY

          node --check presentation-contract-v1.js
          git diff --check

          # Fail closed if anything besides the intended presentation file and
          # this temporary workflow is involved.
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx 'presentation-contract-v1.js'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/pm-lineage-blocker-repair-temp.yml' || true

      - name: Commit repair and remove temporary writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'csw-presentation-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pm-lineage-blocker-repair-temp.yml
          git add presentation-contract-v1.js
          git diff --cached --check
          paths="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/pm-lineage-blocker-repair-temp.yml' 'presentation-contract-v1.js' | sort)"
          test "$paths" = "$expected" || { echo "Unexpected staged paths:" >&2; printf '%s\n' "$paths" >&2; exit 1; }
          git commit -m 'Fix Permanent Marker lineage DOM scope'
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$final_sha" || { echo "Remote main did not converge" >&2; exit 1; }

          # GITHUB_TOKEN pushes do not recursively trigger push workflows.
          # Explicitly dispatch the existing normal Pages workflow on the clean final HEAD.
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-ui-pages.yml/dispatches \
            -d '{"ref":"main"}'
          echo "FINAL_PUBLIC_SHA=$final_sha"
