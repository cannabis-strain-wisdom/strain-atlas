name: Permanent Marker lineage note scope fix V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/permanent-marker-lineage-note-scope-fix-v1.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Limit lineage note presentation to Permanent Marker and add QA
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          presentation = Path('presentation-contract-v1.js')
          s = presentation.read_text(encoding='utf-8')
          old = """  const decorateLineageNote = (root, cultivar) => {\n    const lineage = root.querySelector('.ucd-lineage');\n"""
          new = """  const decorateLineageNote = (root, cultivar) => {\n    if (cultivar?.id !== 'permanent-marker') return false;\n    const lineage = root.querySelector('.ucd-lineage');\n"""
          if old not in s:
              raise SystemExit('Permanent Marker lineage decorator anchor missing')
          s = s.replace(old, new, 1)

          old = """    if (cultivar?.publicContent?.ja?.lineageNote && !root.querySelector('[data-lineage-note-v1=\"true\"]')) throw new Error(`LINEAGE_NOTE_PRESENTATION_MISSING:${cultivar.id}`);\n"""
          new = """    if (cultivar?.id === 'permanent-marker' && cultivar?.publicContent?.ja?.lineageNote && !root.querySelector('[data-lineage-note-v1=\"true\"]')) throw new Error(`LINEAGE_NOTE_PRESENTATION_MISSING:${cultivar.id}`);\n"""
          if old not in s:
              raise SystemExit('Permanent Marker lineage fail-closed anchor missing')
          s = s.replace(old, new, 1)
          presentation.write_text(s, encoding='utf-8')

          qa = Path('.github/scripts/public-frontend-browser-smoke-v2.mjs')
          q = qa.read_text(encoding='utf-8')
          anchor = """  if (rush.horizontalOverflow) throw new Error('Rush detail has horizontal overflow');\n\n  await cdp.send('Page.navigate', { url: `${baseUrl}?strain=new-caledonia` });\n"""
          insert = """  if (rush.horizontalOverflow) throw new Error('Rush detail has horizontal overflow');\n\n  await cdp.send('Page.navigate', { url: `${baseUrl}?strain=permanent-marker` });\n  await waitFor(() => evalv(`document.readyState==='complete'`), 'Permanent Marker document complete');\n  await waitFor(() => evalv(`(()=>{const root=document.querySelector('.detail-public-v1[data-public-detail-id=\"permanent-marker\"]');return document.getElementById('detail-dialog').open===true && root?.dataset.publicPresentationReady==='true' && root.querySelector('[data-lineage-note-v1=\"true\"]')})()`), 'Permanent Marker inline lineage note');\n  const permanentMarkerLineage = await evalv(`(()=>{const root=document.querySelector('.detail-public-v1[data-public-detail-id=\"permanent-marker\"]');const lineage=root?.querySelector('.ucd-lineage');const note=root?.querySelector('[data-lineage-note-v1=\"true\"]');const noteText=note?.textContent?.trim()||'';const duplicate=[...lineage?.querySelectorAll(':scope > div > p')||[]].some(node=>node.textContent.trim()===noteText);return {noteText,directSibling:lineage?.nextElementSibling===note,duplicate,visible:note?getComputedStyle(note).display!=='none':false,horizontalOverflow:root.scrollWidth>root.clientWidth+1}})()`);\n  if (!permanentMarkerLineage.noteText.includes('親側のS1／Bx1／F2表記') || !permanentMarkerLineage.noteText.includes('完成したPermanent Marker自体の世代記号')) throw new Error(`Permanent Marker lineage generation note missing: ${JSON.stringify(permanentMarkerLineage)}`);\n  if (!permanentMarkerLineage.directSibling || !permanentMarkerLineage.visible) throw new Error(`Permanent Marker lineage note placement invalid: ${JSON.stringify(permanentMarkerLineage)}`);\n  if (permanentMarkerLineage.duplicate) throw new Error(`Permanent Marker lineage note duplicated inside collapsed lineage: ${JSON.stringify(permanentMarkerLineage)}`);\n  if (permanentMarkerLineage.horizontalOverflow) throw new Error('Permanent Marker lineage note causes horizontal overflow');\n\n  await cdp.send('Page.navigate', { url: `${baseUrl}?strain=new-caledonia` });\n"""
          if anchor not in q:
              raise SystemExit('Permanent Marker browser QA insertion anchor missing')
          q = q.replace(anchor, insert, 1)
          qa.write_text(q, encoding='utf-8')
          PY

          node --check presentation-contract-v1.js
          node --check .github/scripts/public-frontend-browser-smoke-v2.mjs
          grep -Fq "cultivar?.id !== 'permanent-marker'" presentation-contract-v1.js
          grep -Fq 'Permanent Marker lineage note placement invalid' .github/scripts/public-frontend-browser-smoke-v2.mjs
          git diff --check
          git diff -- presentation-contract-v1.js .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Commit scoped fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "csw-public-presentation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add presentation-contract-v1.js .github/scripts/public-frontend-browser-smoke-v2.mjs
          git rm .github/workflows/permanent-marker-lineage-note-scope-fix-v1.yml
          git diff --cached --check
          git commit -m "Scope inline lineage note to Permanent Marker"
          git push origin HEAD:main

      - name: Dispatch exact Pages validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-ui-pages.yml/dispatches \
            -d '{"ref":"main"}'
