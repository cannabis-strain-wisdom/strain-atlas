name: Flavor Presentation Scaffold V1

on:
  push:
    branches:
      - main
    paths:
      - .github/flavor-presentation-request.json

permissions:
  contents: write

concurrency:
  group: flavor-presentation-scaffold-v1
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify request and current presentation state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const req=JSON.parse(fs.readFileSync('.github/flavor-presentation-request.json','utf8'));
          if(req.schemaVersion!==1||req.reason!=='SKUNK_1_FLAVOR_GAP') throw new Error('unexpected request');
          const p=fs.readFileSync('presentation-contract-v1.js','utf8');
          if(p.includes('UNIVERSAL_FLAVOR_PRESENTATION_V1')) throw new Error('Flavor presentation already exists');
          NODE

      - name: Apply universal Flavor presenter and generic smoke
        shell: bash
        env:
          FLAVOR_JS_B64: " "
          FLAVOR_SMOKE_B64: " 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          presentation=Path('presentation-contract-v1.js')
          presentation.write_text(presentation.read_text(encoding='utf-8')+'\n'+base64.b64decode(os.environ['FLAVOR_JS_B64']).decode('utf-8')+'\n',encoding='utf-8')
          smoke=Path('.github/scripts/public-frontend-browser-smoke-v2.mjs')
          text=smoke.read_text(encoding='utf-8')
          marker="  const runtimeErrors = cdp.events.filter(event => event.method === 'Runtime.exceptionThrown');"
          if text.count(marker)!=1: raise SystemExit(f'Flavor smoke insertion marker count={text.count(marker)}')
          block=base64.b64decode(os.environ['FLAVOR_SMOKE_B64']).decode('utf-8')
          smoke.write_text(text.replace(marker,block+marker,1),encoding='utf-8')
          PY

      - name: Validate syntax and scoped diff
        shell: bash
        run: |
          set -euo pipefail
          node --check presentation-contract-v1.js
          node --check .github/scripts/public-frontend-browser-smoke-v2.mjs
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git add presentation-contract-v1.js .github/scripts/public-frontend-browser-smoke-v2.mjs
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'presentation-contract-v1.js'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/scripts/public-frontend-browser-smoke-v2.mjs'

      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          git commit -m "Add universal Flavor presentation V1"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'PUBLIC_REMOTE_ADVANCED_SAFE_STOP'; exit 75; }
          git push origin HEAD:main
