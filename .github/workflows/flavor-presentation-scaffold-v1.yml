name: Flavor Presentation Scaffold V1

on:
  push:
    branches:
      - main
    paths:
      - .github/flavor-presentation-request.json

permissions:
  contents: write

concurrency:
  group: flavor-presentation-scaffold-v1
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify request
        run: python3 -c "import json; r=json.load(open('.github/flavor-presentation-request.json')); assert r['schemaVersion']==1 and r['reason']=='SKUNK_1_FLAVOR_GAP'"

      - name: Apply Flavor presentation patch
        run: python3 .github/scripts/flavor-presentation-scaffold-v1.py

      - name: Validate syntax
        run: |
          node --check presentation-contract-v1.js
          node --check .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Enforce scoped diff
        run: |
          set -euo pipefail
          git add presentation-contract-v1.js .github/scripts/public-frontend-browser-smoke-v2.mjs
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'presentation-contract-v1.js'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/scripts/public-frontend-browser-smoke-v2.mjs'

      - name: Commit and push
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git commit -m "Add universal Flavor presentation V1"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'PUBLIC_REMOTE_ADVANCED_SAFE_STOP'; exit 75; }
          git push origin HEAD:main
