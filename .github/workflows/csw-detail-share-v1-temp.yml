name: CSW detail share V1 temp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/csw-detail-share-v1-temp.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install universal cultivar share
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import re
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          style_id = 'csw-detail-share-v1-styles'
          script_id = 'csw-detail-share-v1-script'
          style = base64.b64decode('').decode('utf-8')
          script = base64.b64decode('').decode('utf-8')
          if style_id in html or script_id in html:
              if not (style_id in html and script_id in html):
                  raise SystemExit('DETAIL_SHARE_PARTIAL_STATE')
          else:
              html = html.replace('</head>', style + '\n</head>', 1)
              anchor = '  <script src="presentation-contract-v1.js?v=4" defer></script>'
              if html.count(anchor) != 1:
                  raise SystemExit('DETAIL_SHARE_SCRIPT_ANCHOR_MISMATCH')
              html = html.replace(anchor, script + '\n' + anchor, 1)
          if html.count(style_id) != 1 or html.count(script_id) != 1:
              raise SystemExit('DETAIL_SHARE_SENTINEL_MISMATCH')
          if html.count('data-website-id="176ab4f1-4681-422b-b47e-b4058890d210"') != 1:
              raise SystemExit('UMAMI_TRACKER_MISMATCH')
          match = re.search(r'<script id="csw-detail-share-v1-script">\n(.*?)\n  </script>', html, re.S)
          if not match:
              raise SystemExit('DETAIL_SHARE_SCRIPT_EXTRACTION_FAILED')
          Path('/tmp/csw-detail-share-v1.js').write_text(match.group(1), encoding='utf-8')
          path.write_text(html, encoding='utf-8')
          PY
          node --check /tmp/csw-detail-share-v1.js
          git diff --check -- index.html
          grep -Fq 'id="csw-detail-share-v1-styles"' index.html
          grep -Fq 'id="csw-detail-share-v1-script"' index.html
          grep -Fq 'navigator.share' index.html
          git rm -f .github/workflows/csw-detail-share-v1-temp.yml
          git add -- index.html
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=('.github/workflows/csw-detail-share-v1-temp.yml' 'index.html')
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected staged paths: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          git config user.name "csw-detail-share-installer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add cultivar detail share control"
          git push origin HEAD:main
          if git ls-remote --exit-code --heads origin refs/heads/tmp-detail-share-v1 >/dev/null 2>&1; then
            git push origin --delete tmp-detail-share-v1 || echo 'TEMP_BRANCH_DELETE_FAILED'
          fi

      - name: Dispatch durable Pages verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-ui-pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Pages workflow dispatched'
