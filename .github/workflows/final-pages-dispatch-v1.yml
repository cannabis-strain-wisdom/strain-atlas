name: Final Permanent Marker Pages dispatch V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-pages-dispatch-v1.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove one-time dispatcher and push clean main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "csw-public-presentation-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/final-pages-dispatch-v1.yml
          git commit -m "Clean final Pages dispatcher"
          git push origin HEAD:main

      - name: Dispatch Pages validation against clean main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-public-ui-pages.yml/dispatches \
            -d '{"ref":"main"}'
