name: Do-Si-Dos lineage panel reduction preview V2

on:
  push:
    branches:
      - preview/do-si-dos-lineage-panel-content-reduction-polish-v2

permissions:
  contents: read

concurrency:
  group: csw-do-si-dos-lineage-panel-reduction-v2
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check name-relationships-v1.js
          node --check .github/scripts/public-detail-interaction-v1.mjs

      - name: Stage local preview artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _qa/runtime _qa/production _qa/assets
          install -m 0644 index.html app.min.js presentation-contract-v1.js name-relationships-v1.js detail-interaction-v1.js detail-share-v2.js styles.min.css site-updates.json .nojekyll _qa/
          install -m 0644 runtime/catalog.json _qa/runtime/catalog.json
          install -m 0644 production/publication.json _qa/production/publication.json
          rsync -a assets/ _qa/assets/
          python3 <<'PY'
          from pathlib import Path
          path = Path('_qa/index.html')
          html = path.read_text(encoding='utf-8')
          pending = []
          for filename in ['detail-share-v2.js','detail-interaction-v1.js','name-relationships-v1.js']:
              if filename not in html:
                  pending.append(f'  <script defer src="{filename}"></script>')
          if pending:
              if html.count('</body>') != 1:
                  raise SystemExit('Expected exactly one closing body tag')
              html = html.replace('</body>', '\n'.join(pending) + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Browser semantics and 390px reduction preview capture
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="${CHROME_BIN:-}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)"
          fi
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium not found on runner' >&2; exit 1; }

          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_qa" >"$RUNNER_TEMP/csw-reduction-preview-http.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done

          CHROME_BIN="$CHROME_BIN" PREVIEW_DIR="$RUNNER_TEMP/do-si-dos-lineage-panel-reduction-v2" node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          const chrome=process.env.CHROME_BIN;
          const out=process.env.PREVIEW_DIR;
          fs.mkdirSync(out,{recursive:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function getJson(url){const r=await fetch(url);if(!r.ok)throw new Error(`${url} HTTP ${r.status}`);return r.json();}
          async function waitFor(fn,label,timeout=15000){const started=Date.now();let last;while(Date.now()-started<timeout){try{last=await fn();if(last)return last;}catch(e){last=e;}await sleep(100);}throw new Error(`Timeout waiting for ${label}: ${last?.message||last||''}`);}
          class CDP{
            constructor(url){this.ws=new WebSocket(url);this.id=0;this.pending=new Map();this.exceptions=[];}
            async open(){
              await new Promise((resolve,reject)=>{this.ws.addEventListener('open',resolve,{once:true});this.ws.addEventListener('error',reject,{once:true});});
              this.ws.addEventListener('message',event=>{
                const m=JSON.parse(event.data);
                if(m.id){
                  const p=this.pending.get(m.id);
                  if(!p)return;
                  this.pending.delete(m.id);
                  m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);
                  return;
                }
                if(m.method==='Runtime.exceptionThrown') this.exceptions.push(m);
              });
            }
            send(method,params={}){const id=++this.id;return new Promise((resolve,reject)=>{this.pending.set(id,{resolve,reject});this.ws.send(JSON.stringify({id,method,params}));});}
            close(){this.ws.close();}
          }

          let proc, page, port;
          for(let attempt=0;attempt<2;attempt++){
            const profile=fs.mkdtempSync(path.join(os.tmpdir(),`csw-reduction-${attempt}-`));
            port=9244+attempt;
            proc=spawn(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage',`--remote-debugging-port=${port}`,`--user-data-dir=${profile}`,'about:blank'],{stdio:['ignore','pipe','pipe']});
            try{
              await waitFor(async()=>{try{return await getJson(`http://127.0.0.1:${port}/json/version`)}catch{return false}},'chrome',12000);
              const pages=await getJson(`http://127.0.0.1:${port}/json/list`);
              page=pages.find(x=>x.type==='page');
              if(page) break;
            }catch(e){
              proc.kill('SIGTERM');
              if(attempt===1) throw e;
              await sleep(300);
            }
          }
          if(!page) throw new Error('No page target');

          try{
            const cdp=new CDP(page.webSocketDebuggerUrl);
            await cdp.open();
            await cdp.send('Page.enable');
            await cdp.send('Runtime.enable');
            await cdp.send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:1,mobile:false});
            const evalv=async expression=>{
              const r=await cdp.send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
              if(r.exceptionDetails) throw new Error(r.exceptionDetails.text);
              return r.result.value;
            };

            await cdp.send('Page.navigate',{url:'http://127.0.0.1:4173/?strain=do-si-dos'});
            await waitFor(()=>evalv(`document.readyState==='complete'`),'document');
            await waitFor(()=>evalv(`window.__CSWLineageParentContextV1?.status==='PASS'&&window.__CSWLineageParentContextV1?.presentation==='reduced-polish-inline-inside-existing-lineage'`),'reduced lineage content');

            const closedState=await evalv(`(()=>{
              const lineage=document.querySelector('#detail-shell .ucd-lineage');
              return lineage?{open:lineage.open,summary:lineage.querySelector(':scope > summary strong')?.textContent.trim()||''}:null;
            })()`);
            if(!closedState||closedState.open||closedState.summary!=='OGKB × Face Off OG BX1') throw new Error(`Closed summary changed: ${JSON.stringify(closedState)}`);

            await evalv(`(()=>{const lineage=document.querySelector('#detail-shell .ucd-lineage');if(!lineage)return false;lineage.open=true;lineage.scrollIntoView({block:'start'});return true;})()`);
            await sleep(250);

            const state=await evalv(`(()=>{
              const root=document.querySelector('.ucd-root[data-public-detail-id="do-si-dos"],.detail-public-v1[data-public-detail-id="do-si-dos"]');
              const lineage=document.querySelector('#detail-shell .ucd-lineage');
              const body=lineage?.querySelector(':scope > div');
              const context=body?.querySelector('[data-lineage-parent-context-v1="do-si-dos"]');
              const story=body?.querySelector('[data-lineage-story-v1="do-si-dos"]');
              const evidence=body?.querySelector(':scope > .ucd-evidence-row');
              if(!root||!lineage||!body||!context||!story||!evidence)return null;
              const cs=getComputedStyle(context);
              const ss=getComputedStyle(story);
              const rows=[...context.querySelectorAll('.csw-lineage-parent-context-row')].map(row=>({
                parent:row.querySelector('strong')?.textContent.trim()||'',
                context:row.querySelector('span')?.textContent.trim()||''
              }));
              return {
                viewport:window.innerWidth,
                lineageValue:lineage.querySelector(':scope > summary strong')?.textContent.trim()||'',
                contextHeading:context.querySelector('.csw-lineage-parent-context-head span')?.textContent.trim()||'',
                contextMetaCount:context.querySelectorAll('.csw-lineage-parent-context-head small').length,
                contextBorderTop:cs.borderTopStyle,
                contextRadius:cs.borderTopLeftRadius,
                contextBackground:cs.backgroundImage,
                rows,
                storyKicker:story.querySelector('.csw-lineage-story-kicker')?.textContent.trim()||'',
                storyText:story.querySelector('p')?.textContent.trim()||'',
                storyBackground:ss.backgroundImage,
                storyRadius:ss.borderTopRightRadius,
                storyLeftBorder:ss.borderLeftStyle,
                contextBeforeStory:Boolean(context.compareDocumentPosition(story)&Node.DOCUMENT_POSITION_FOLLOWING),
                storyBeforeEvidence:Boolean(story.compareDocumentPosition(evidence)&Node.DOCUMENT_POSITION_FOLLOWING),
                mapCount:lineage.querySelectorAll('[data-lineage-map-v1="do-si-dos"]').length,
                compositionCount:lineage.querySelectorAll('[data-lineage-composition-v1="do-si-dos"]').length,
                overflow:root.scrollWidth>root.clientWidth+1||document.documentElement.scrollWidth>document.documentElement.clientWidth+1
              };
            })()`);

            if(!state||state.viewport!==390||state.lineageValue!=='OGKB × Face Off OG BX1'||state.rows.length!==2||state.mapCount!==0||state.compositionCount!==0||!state.contextBeforeStory||!state.storyBeforeEvidence||state.overflow) throw new Error(`Reduction state mismatch: ${JSON.stringify(state)}`);
            if(state.contextHeading!=='PARENT CONTEXT / 親の背景'||state.contextMetaCount!==0) throw new Error(`Context reduction mismatch: ${JSON.stringify(state)}`);
            if(state.contextBorderTop!=='none'||state.contextRadius!=='0px'||state.contextBackground!=='none') throw new Error(`Context still boxed: ${JSON.stringify(state)}`);
            if(state.storyBackground!=='none'||state.storyRadius!=='0px'||state.storyLeftBorder!=='solid') throw new Error(`Story still over-built: ${JSON.stringify(state)}`);
            if(state.storyText!=='CSWではOGKBをGirl Scout Cookiesへ、Face Off OG BX1をOG Kushへ置き換えず、確認されたdirect parent名をそのまま保持しています。') throw new Error(`Story copy mismatch: ${JSON.stringify(state.storyText)}`);
            if(!state.rows.some(x=>x.parent==='OGKB'&&x.context==='Cookies / GSC side')||!state.rows.some(x=>x.parent==='Face Off OG BX1'&&x.context==='OG side')) throw new Error(`Parent rows mismatch: ${JSON.stringify(state.rows)}`);
            if(cdp.exceptions.length) throw new Error(`Runtime exceptions: ${JSON.stringify(cdp.exceptions.slice(0,3))}`);

            const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            fs.writeFileSync(path.join(out,'do-si-dos-lineage-panel-reduction-v2-390.png'),Buffer.from(shot.data,'base64'));
            fs.writeFileSync(path.join(out,'do-si-dos-lineage-panel-reduction-v2-390.json'),JSON.stringify({closedState,state},null,2)+'\n');
            console.log(JSON.stringify({closedState,state},null,2));
            cdp.close();
          } finally {
            proc?.kill('SIGTERM');
          }
          NODE

      - name: Upload Do-Si-Dos reduction preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: do-si-dos-lineage-panel-reduction-v2-${{ github.sha }}
          path: ${{ runner.temp }}/do-si-dos-lineage-panel-reduction-v2
          if-no-files-found: error
          retention-days: 7
