name: Keyword search disclosure V1 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/keyword-search-disclosure-v1-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard trigger state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a1323dddc84526e28e93c8aa7beec141b9357fe7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/keyword-search-disclosure-v1-once.yml"

      - name: Apply patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/keyword-search-disclosure-v1-once.py
          grep -Fq 'id="keyword-search-disclosure"' index.html
          grep -Fq 'csw-keyword-search-disclosure-v1-styles' index.html
          grep -Fq 'id="search"' index.html
          node --check app.min.js
          node --check presentation-contract-v1.js

      - name: Publish exact delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git rm .github/workflows/keyword-search-disclosure-v1-once.yml
          git rm .github/scripts/keyword-search-disclosure-v1-once.py
          git add index.html
          git diff --cached --name-only | sort > /tmp/actual
          printf '%s\n' '.github/scripts/keyword-search-disclosure-v1-once.py' '.github/workflows/keyword-search-disclosure-v1-once.yml' 'index.html' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git commit -m "Collapse keyword search behind tap disclosure"
          git push origin HEAD:main
