name: MAC 1 PRESENTATION REPAIR V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mac-1-presentation-repair-v1.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MAC 1 data and grouped presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = "const TARGETS = new Set(['fat-banana-auto','blue-gelato-41','sour-diesel','mimosa','apple-fritter']);"
          new = "const TARGETS = new Set(['fat-banana-auto','blue-gelato-41','sour-diesel','mimosa','apple-fritter','mac-1']);"
          if text.count(old) != 1:
              raise SystemExit(f'INDEX_SENSORY_TARGET_SHAPE:{text.count(old)}')
          index.write_text(text.replace(old, new, 1))

          presentation = Path('presentation-contract-v1.js')
          text = presentation.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'PRESENTATION_EC_TARGET_SHAPE:{text.count(old)}')
          text = text.replace(old, new, 1)
          label_old = "    'climate:unspecified': '気候'\n"
          label_new = "    'climate:unspecified': '気候',\n    'vegetativeStage:unspecified': '栄養成長期'\n"
          if text.count(label_old) != 1:
              raise SystemExit(f'VEGETATIVE_LABEL_SHAPE:{text.count(label_old)}')
          presentation.write_text(text.replace(label_old, label_new, 1))
          PY

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='runtime/catalog.json';
          const catalog=JSON.parse(fs.readFileSync(p,'utf8'));
          const mac=(catalog.cultivars||[]).find(x=>x.id==='mac-1');
          if(!mac) throw new Error('MAC1_RUNTIME_MISSING');
          mac.cultivation={
            status:'confirmed',
            confidence:'B',
            basis:'historicalSource',
            sourceRefs:['cannabis-now-return-of-the-mac'],
            observations:[{
              field:'vegetativeStage',
              environment:'unspecified',
              valueForm:'TEXT',
              rawText:'The real cut can take a little longer in the vegetative stage.',
              text:'The authentic MAC1 cut can take a little longer in the vegetative stage.',
              displayText:'栄養成長期はやや長め'
            }],
            note:'A direct written interview with Capulator describes the authentic MAC1 cut as taking a little longer in the vegetative stage. This is preserved as a qualitative vegetative-stage observation and is not converted into flowering time or a numeric duration.'
          };
          fs.writeFileSync(p,JSON.stringify(catalog,null,2)+'\n');
          NODE

      - name: Regression assertions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index=fs.readFileSync('index.html','utf8');
          const presentation=fs.readFileSync('presentation-contract-v1.js','utf8');
          const catalog=JSON.parse(fs.readFileSync('runtime/catalog.json','utf8'));
          const mac=catalog.cultivars.find(x=>x.id==='mac-1');
          if(!index.includes("'apple-fritter','mac-1'")) throw new Error('MAC1_SENSORY_GROUP_TARGET_MISSING');
          if(!presentation.includes("'apple-fritter','mac-1'")) throw new Error('MAC1_EFFECT_CULTIVATION_TARGET_MISSING');
          if(!presentation.includes("'vegetativeStage:unspecified': '栄養成長期'")) throw new Error('MAC1_VEGETATIVE_LABEL_MISSING');
          if(mac?.cultivation?.status!=='confirmed') throw new Error('MAC1_CULTIVATION_MISSING');
          if(mac.cultivation.observations?.[0]?.displayText!=='栄養成長期はやや長め') throw new Error('MAC1_CULTIVATION_DISPLAY_MISMATCH');
          console.log('MAC1_PRESENTATION_REPAIR_ASSERTIONS_PASS');
          NODE
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cannabis-strain-wisdom'
          git config user.email '316430215+cannabis-strain-wisdom@users.noreply.github.com'
          rm .github/workflows/mac-1-presentation-repair-v1.yml
          git add index.html presentation-contract-v1.js runtime/catalog.json .github/workflows/mac-1-presentation-repair-v1.yml
          git diff --cached --check
          git commit -m 'Repair MAC 1 grouped detail presentation and cultivation data'
          git push origin HEAD:main
