name: Detail safety validation V1

on:
  push:
    branches:
      - validated/detail-safety-baseline-v1

permissions:
  contents: read

concurrency:
  group: csw-detail-safety-validation-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.min.js
          node --check presentation-contract-v1.js
          node --check name-relationships-v1.js
          node --check detail-interaction-v1.js
          node --check .github/scripts/public-current-runtime-authority-v1.mjs
          node --check .github/scripts/public-frontend-browser-smoke-v2.mjs
          node --check .github/scripts/public-detail-card-uniformity-v1.mjs
          node --check .github/scripts/public-detail-safety-baseline-v1.mjs
          node --check .github/scripts/public-detail-interaction-v1.mjs

      - name: Stage validation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _qa/runtime _qa/production _qa/assets
          install -m 0644 index.html app.min.js presentation-contract-v1.js name-relationships-v1.js detail-interaction-v1.js styles.min.css site-updates.json .nojekyll _qa/
          install -m 0644 runtime/catalog.json _qa/runtime/catalog.json
          install -m 0644 production/publication.json _qa/production/publication.json
          rsync -a assets/ _qa/assets/

          python3 <<'PY'
          from pathlib import Path
          path = Path('_qa/index.html')
          html = path.read_text(encoding='utf-8')
          scripts = []
          if 'detail-interaction-v1.js' not in html:
              scripts.append('  <script defer src="detail-interaction-v1.js"></script>')
          if 'name-relationships-v1.js' not in html:
              scripts.append('  <script defer src="name-relationships-v1.js"></script>')
          if scripts:
              if html.count('</body>') != 1:
                  raise SystemExit('Expected exactly one closing body tag')
              html = html.replace('</body>', '\n'.join(scripts) + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

          grep -Fq 'detail-interaction-v1.js' _qa/index.html
          grep -Fq 'name-relationships-v1.js' _qa/index.html
          grep -Fq 'CSW_DETAIL_INTERACTION_V1' _qa/detail-interaction-v1.js
          grep -Fq 'RAINBOW_BELTS_NAME_RELATIONSHIP_RAIL_V1' _qa/name-relationships-v1.js

      - name: Local browser safety baseline
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="${CHROME_BIN:-}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)"
          fi
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium not found on runner' >&2; exit 1; }
          "$CHROME_BIN" --version

          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_qa" >"$RUNNER_TEMP/csw-detail-safety-http.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/runtime/catalog.json >/dev/null

          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-current-runtime-authority-v1.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-safety-baseline-v1.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-interaction-v1.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' CSW_SCREENSHOT_DIR="$RUNNER_TEMP/csw-detail-safety-screenshots" node .github/scripts/public-detail-card-uniformity-v1.mjs

          echo 'DETAIL SAFETY VALIDATION V1 PASS'
