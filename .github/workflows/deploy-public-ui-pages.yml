name: Deploy public UI to GitHub Pages
# One-time detail-share installer. This file restores itself to the previous durable workflow in the feature commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages-public-ui
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public UI shell
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install cultivar share and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          style_id = 'csw-detail-share-v1-styles'
          script_id = 'csw-detail-share-v1-script'

          if style_id not in html and script_id not in html:
              style = r'''  <style id="csw-detail-share-v1-styles">
    .detail-shell.csw-detail-share-ready{padding-top:56px}
    .detail-shell.csw-detail-share-ready>.csw-detail-actionbar-v1{position:fixed!important;top:0;left:50%;right:auto;width:min(100%,980px);transform:translateX(-50%);z-index:90;box-sizing:border-box;background:rgba(3,9,6,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .detail-shell.csw-detail-share-ready>.csw-detail-actionbar-v1 .detail-topbar-line{flex:0 0 44px}
    .detail-share-button{appearance:none;display:grid;width:44px;height:44px;flex:0 0 44px;place-items:center;margin-left:auto;padding:0;border:1px solid rgba(217,182,93,.14);border-radius:50%;background:rgba(255,255,255,.025);color:#f4f1e7;cursor:pointer}
    .detail-share-button+.close-detail{margin-left:0!important}
    .detail-share-button svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .detail-share-button:focus-visible{outline:2px solid rgba(233,207,126,.82);outline-offset:2px}
    .detail-share-button.is-copied{border-color:rgba(105,169,120,.42);color:#a8d9b2}
    @media(max-width:699px){.detail-shell.csw-detail-share-ready>.csw-detail-actionbar-v1{width:100%}}
  </style>'''

              script = r'''  <script id="csw-detail-share-v1-script">
  (() => {
    'use strict';
    const shell = document.getElementById('detail-shell');
    if (!shell) return;
    const shareIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"></path><path d="m8 7 4-4 4 4"></path><path d="M5 11v8h14v-8"></path></svg>';
    const copiedIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"></path></svg>';

    const enhance = () => {
      const bar = shell.querySelector(':scope > .detail-topbar');
      const close = bar?.querySelector('.close-detail');
      if (!bar || !close) {
        shell.classList.remove('csw-detail-share-ready');
        return;
      }
      bar.classList.add('csw-detail-actionbar-v1');
      if (!bar.querySelector('[data-detail-share]')) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'detail-share-button';
        button.dataset.detailShare = 'v1';
        button.setAttribute('aria-label', 'この品種を共有');
        button.innerHTML = shareIcon;
        close.before(button);
      }
      shell.classList.add('csw-detail-share-ready');
    };

    const shareUrl = () => {
      const current = new URL(location.href);
      const clean = new URL(current.origin + current.pathname);
      const strain = current.searchParams.get('strain');
      if (strain) clean.searchParams.set('strain', strain);
      return clean.href;
    };

    const copyUrl = async url => {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(url);
        return;
      }
      const area = document.createElement('textarea');
      area.value = url;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      if (!ok) throw new Error('COPY_FAILED');
    };

    const copiedFeedback = button => {
      button.classList.add('is-copied');
      button.setAttribute('aria-label', 'リンクをコピーしました');
      button.innerHTML = copiedIcon;
      window.setTimeout(() => {
        if (!button.isConnected) return;
        button.classList.remove('is-copied');
        button.setAttribute('aria-label', 'この品種を共有');
        button.innerHTML = shareIcon;
      }, 1400);
    };

    shell.addEventListener('click', async event => {
      const button = event.target.closest('[data-detail-share]');
      if (!button || !shell.contains(button)) return;
      event.preventDefault();
      event.stopPropagation();
      const url = shareUrl();
      const name = shell.querySelector('.detail-hero h2')?.textContent?.trim() || 'Cannabis Strain Wisdom';
      try {
        if (typeof navigator.share === 'function') {
          await navigator.share({ title: `${name} | Cannabis Strain Wisdom`, text: `${name} | Cannabis Strain Wisdom`, url });
          return;
        }
        await copyUrl(url);
        copiedFeedback(button);
      } catch (error) {
        if (error?.name === 'AbortError') return;
        try {
          await copyUrl(url);
          copiedFeedback(button);
        } catch (_) {}
      }
    }, true);

    new MutationObserver(enhance).observe(shell, { childList: true });
    enhance();
  })();
  </script>'''

              html = html.replace('</head>', style + '\n</head>', 1)
              anchor = '  <script src="presentation-contract-v1.js?v=4" defer></script>'
              if html.count(anchor) != 1:
                  raise SystemExit('DETAIL_SHARE_SCRIPT_ANCHOR_MISMATCH')
              html = html.replace(anchor, script + '\n' + anchor, 1)
          elif not (style_id in html and script_id in html):
              raise SystemExit('DETAIL_SHARE_PARTIAL_STATE')

          if html.count(style_id) != 1 or html.count(script_id) != 1:
              raise SystemExit('DETAIL_SHARE_SENTINEL_MISMATCH')
          if html.count('data-website-id="176ab4f1-4681-422b-b47e-b4058890d210"') != 1:
              raise SystemExit('UMAMI_TRACKER_MISMATCH')
          path.write_text(html, encoding='utf-8')
          PY

          python3 <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="csw-detail-share-v1-script">\n(.*?)\n  </script>', html, re.S)
          if not match:
              raise SystemExit('DETAIL_SHARE_SCRIPT_EXTRACTION_FAILED')
          Path('/tmp/csw-detail-share-v1.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/csw-detail-share-v1.js
          grep -Fq 'id="csw-detail-share-v1-styles"' index.html
          grep -Fq 'id="csw-detail-share-v1-script"' index.html
          grep -Fq 'data-detail-share' index.html
          grep -Fq 'navigator.share' index.html
          grep -Fq "searchParams.set('strain', strain)" index.html

          # Restore the durable deploy workflow from the parent commit and remove the failed temporary installer.
          git checkout HEAD^ -- .github/workflows/deploy-public-ui-pages.yml
          if [ -f .github/workflows/csw-detail-share-v1-temp.yml ]; then
            git rm -f .github/workflows/csw-detail-share-v1-temp.yml
          fi
          git add -- index.html .github/workflows/deploy-public-ui-pages.yml
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            '.github/workflows/csw-detail-share-v1-temp.yml'
            '.github/workflows/deploy-public-ui-pages.yml'
            'index.html'
          )
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected staged paths:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          git config user.name "csw-detail-share-installer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add cultivar detail share control"
          git push origin HEAD:main

          if git ls-remote --exit-code --heads origin refs/heads/tmp-detail-share-v1 >/dev/null 2>&1; then
            git push origin --delete tmp-detail-share-v1
          fi
          test -z "$(git ls-remote --heads origin refs/heads/tmp-detail-share-v1)"
          echo "DETAIL SHARE FEATURE COMMIT: $(git rev-parse HEAD)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage public UI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/runtime _site/production _site/assets
          install -m 0644 index.html app.min.js presentation-contract-v1.js styles.min.css site-updates.json .nojekyll _site/
          install -m 0644 runtime/catalog.json _site/runtime/catalog.json
          install -m 0644 production/publication.json _site/production/publication.json
          rsync -a assets/ _site/assets/

          app_key="$(sha256sum _site/app.min.js | cut -c1-12)"
          presentation_key="$(sha256sum _site/presentation-contract-v1.js | cut -c1-12)"
          css_key="$(sha256sum _site/styles.min.css | cut -c1-12)"
          APP_KEY="$app_key" PRESENTATION_KEY="$presentation_key" CSS_KEY="$css_key" python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          html, app_count = re.subn(
              r'app\.min\.js(?:\?v=[^"]*)?',
              f'app.min.js?v={os.environ["APP_KEY"]}',
              html,
              count=1,
          )
          html, css_count = re.subn(
              r'styles\.min\.css(?:\?v=[^"]*)?',
              f'styles.min.css?v={os.environ["CSS_KEY"]}',
              html,
              count=1,
          )
          html, presentation_count = re.subn(
              r'presentation-contract-v1\.js(?:\?v=[^"]*)?',
              f'presentation-contract-v1.js?v={os.environ["PRESENTATION_KEY"]}',
              html,
              count=1,
          )
          if app_count != 1 or presentation_count != 1 or css_count != 1:
              raise SystemExit(
                  f"Cache-bust target mismatch: app={app_count} presentation={presentation_count} css={css_count}"
              )
          path.write_text(html, encoding="utf-8")
          PY

          test -f _site/index.html
          test -f _site/app.min.js
          test -f _site/presentation-contract-v1.js
          test -f _site/styles.min.css
          test -f _site/site-updates.json
          test -f _site/runtime/catalog.json
          test -f _site/production/publication.json
          grep -q 'Cannabis Strain Wisdom' _site/index.html
          grep -q '新着の品種' _site/index.html
          grep -q 'すべての品種' _site/index.html
          grep -Fq 'id="detail-dialog"' _site/index.html
          grep -Fq 'id="csw-detail-share-v1-styles"' _site/index.html
          grep -Fq 'id="csw-detail-share-v1-script"' _site/index.html
          grep -Fq 'data-website-id="176ab4f1-4681-422b-b47e-b4058890d210"' _site/index.html
          grep -Fq 'showModal' _site/app.min.js
          grep -Fq 'data-strain-id' _site/app.min.js
          grep -Fq "app.min.js?v=${app_key}" _site/index.html
          grep -Fq "presentation-contract-v1.js?v=${presentation_key}" _site/index.html
          grep -Fq "styles.min.css?v=${css_key}" _site/index.html
          node --check _site/app.min.js
          node --check _site/presentation-contract-v1.js
          ! grep -q 'COMING LATER' _site/index.html
          ! grep -q 'MASTER PREVIEW' _site/index.html
          ! grep -R -q 'sourceMappingURL' _site
          ! find _site -type f -name '*.map' -print -quit | grep -q .
          ! find _site -type f \( -iname '*pilot*' -o -iname '*test*' -o -iname '*audited*' \) -print -quit | grep -q .
          ! grep -qE 'TOP BUD FRAMING|First repair batch|already-safe images' _site/app.min.js

          while IFS= read -r file; do
            case "$file" in
              _site/.nojekyll|_site/index.html|_site/app.min.js|_site/presentation-contract-v1.js|_site/styles.min.css|_site/site-updates.json|_site/runtime/catalog.json|_site/production/publication.json|_site/assets/cultivars/*.webp|_site/assets/cultivars/*.svg|_site/assets/ogp/cannabis-strain-wisdom-v3.jpg) ;;
              *) echo "Unexpected Pages artifact: $file" >&2; exit 1 ;;
            esac
          done < <(find _site -type f -print | sort)

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('_site/runtime/catalog.json', 'utf8'));
          const publication = JSON.parse(fs.readFileSync('_site/production/publication.json', 'utf8'));

          if (!Array.isArray(catalog.cultivars) || catalog.cultivars.length === 0) {
            throw new Error('Catalog cultivars missing or empty');
          }
          if (!Array.isArray(publication.entries) || publication.entries.length === 0) {
            throw new Error('Publication entries missing or empty');
          }

          const catalogIds = catalog.cultivars.map(cultivar => cultivar?.id);
          const publicationIds = publication.entries.map(entry => entry?.strainId);
          const publishedIds = publication.entries
            .filter(entry => entry?.state === 'published')
            .map(entry => entry?.strainId);

          if (catalogIds.some(id => typeof id !== 'string' || !id)) {
            throw new Error('Catalog contains invalid cultivar IDs');
          }
          if (publicationIds.some(id => typeof id !== 'string' || !id)) {
            throw new Error('Publication contains invalid strain IDs');
          }

          const duplicates = ids => [
            ...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))
          ].sort();
          const duplicateCatalogIds = duplicates(catalogIds);
          const duplicatePublicationIds = duplicates(publicationIds);

          if (duplicateCatalogIds.length) {
            throw new Error(`Duplicate catalog cultivar IDs: ${duplicateCatalogIds.join(', ')}`);
          }
          if (duplicatePublicationIds.length) {
            throw new Error(`Duplicate publication strain IDs: ${duplicatePublicationIds.join(', ')}`);
          }

          const catalogSet = [...catalogIds].sort();
          const publishedSet = [...publishedIds].sort();
          if (JSON.stringify(catalogSet) !== JSON.stringify(publishedSet)) {
            const catalogOnly = catalogSet.filter(id => !publishedSet.includes(id));
            const publicationOnly = publishedSet.filter(id => !catalogSet.includes(id));
            throw new Error(
              `Catalog/publication mismatch; catalog-only=[${catalogOnly.join(', ')}] published-only=[${publicationOnly.join(', ')}]`
            );
          }

          for (const cultivar of catalog.cultivars) {
            for (const visual of cultivar.visuals || []) {
              if (visual?.src) fs.accessSync(`_site/${visual.src}`);
            }
          }
          NODE

      - name: Browser interaction smoke before deploy
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="${CHROME_BIN:-}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)"
          fi
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium not found on runner' >&2; exit 1; }
          echo "Using browser: $CHROME_BIN"
          "$CHROME_BIN" --version

          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_site" >"$RUNNER_TEMP/csw-http.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/runtime/catalog.json >/dev/null
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-current-runtime-authority-v1.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-card-uniformity-v1.mjs
          echo "PUBLIC FRONTEND BROWSER SMOKE PASS"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Deploy public UI
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact deployed PUBLIC state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for exact live artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas'
          LIVE_DIR="$RUNNER_TEMP/csw-live"
          mkdir -p "$LIVE_DIR/runtime" "$LIVE_DIR/production"

          fetch_live() {
            nonce="$(date +%s%N)"
            curl -fsSL "${BASE_URL}/index.html?verify=${GITHUB_SHA}-${nonce}" -o "$LIVE_DIR/index.html"
            curl -fsSL "${BASE_URL}/app.min.js?verify=${GITHUB_SHA}-${nonce}" -o "$LIVE_DIR/app.min.js"
            curl -fsSL "${BASE_URL}/presentation-contract-v1.js?verify=${GITHUB_SHA}-${nonce}" -o "$LIVE_DIR/presentation-contract-v1.js"
            curl -fsSL "${BASE_URL}/styles.min.css?verify=${GITHUB_SHA}-${nonce}" -o "$LIVE_DIR/styles.min.css"
            curl -fsSL "${BASE_URL}/runtime/catalog.json?verify=${GITHUB_SHA}-${nonce}" -o "$LIVE_DIR/runtime/catalog.json"
            curl -fsSL "${BASE_URL}/production/publication.json?verify=${GITHUB_SHA}-${nonce}" -o "$LIVE_DIR/production/publication.json"
          }

          exact_match() {
            cmp -s app.min.js "$LIVE_DIR/app.min.js" &&
            cmp -s presentation-contract-v1.js "$LIVE_DIR/presentation-contract-v1.js" &&
            cmp -s styles.min.css "$LIVE_DIR/styles.min.css" &&
            cmp -s runtime/catalog.json "$LIVE_DIR/runtime/catalog.json" &&
            cmp -s production/publication.json "$LIVE_DIR/production/publication.json"
          }

          matched=0
          for n in $(seq 1 30); do
            if fetch_live && exact_match; then
              matched=1
              break
            fi
            sleep 2
          done
          test "$matched" -eq 1 || { echo 'Live artifact did not converge to exact deployed PUBLIC state' >&2; exit 1; }

          fetch_live
          exact_match
          grep -Fq 'id="csw-detail-share-v1-styles"' "$LIVE_DIR/index.html"
          grep -Fq 'id="csw-detail-share-v1-script"' "$LIVE_DIR/index.html"
          grep -Fq 'data-website-id="176ab4f1-4681-422b-b47e-b4058890d210"' "$LIVE_DIR/index.html"
          grep -Fq 'UNIVERSAL_MORPHOLOGY_PRESENTATION_V1' "$LIVE_DIR/presentation-contract-v1.js"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/csw-live/runtime/catalog.json', 'utf8'));
          const shaman = catalog.cultivars.find(item => item?.id === 'shaman');
          if (!shaman) throw new Error('Live Shaman missing');
          if (shaman.morphology?.status !== 'confirmed') throw new Error('Live Shaman morphology not confirmed');
          if (shaman.morphology?.presentation?.mode !== 'summary') throw new Error('Live Shaman morphology presentation missing');
          if (!String(shaman.morphology?.presentation?.textJa || '').trim()) throw new Error('Live Shaman morphology Japanese summary missing');
          if (Object.hasOwn(shaman.morphology || {}, 'items') || Object.hasOwn(shaman.morphology || {}, 'note')) {
            throw new Error('Live Shaman leaked PRIVATE morphology fields');
          }
          console.log('LIVE ARTIFACT EXACT MATCH + SHAMAN MORPHOLOGY BOUNDARY PASS');
          NODE

      - name: Browser interaction smoke against live Pages
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="${CHROME_BIN:-}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)"
          fi
          test -n "$CHROME_BIN" || { echo 'Chrome/Chromium not found on runner' >&2; exit 1; }
          "$CHROME_BIN" --version
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas/' node .github/scripts/public-current-runtime-authority-v1.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas/' node .github/scripts/public-frontend-browser-smoke-v2.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='https://cannabis-strain-wisdom.github.io/strain-atlas/' node .github/scripts/public-detail-card-uniformity-v1.mjs
          echo "PUBLIC LIVE BROWSER SMOKE PASS"
