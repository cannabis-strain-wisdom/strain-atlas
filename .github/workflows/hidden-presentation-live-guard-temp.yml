name: Hidden presentation live convergence guard temporary

on:
  push:
    branches: [candidate/hidden-presentation-live-guard-20260908]
    paths: [.github/workflows/hidden-presentation-live-guard-temp.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/hidden-presentation-live-guard-20260908
          fetch-depth: 0

      - name: Guard exact PUBLIC base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "f43c1f8b1ef68b794456fad92d80d91c2bd9fbe9"
          test "$(git merge-base HEAD origin/main)" = "f43c1f8b1ef68b794456fad92d80d91c2bd9fbe9"

      - name: Append bounded final-state hidden presentation guard
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const file='app.min.js';
          const marker='data-csw-hidden-presentation-live-guard-v1';
          let text=fs.readFileSync(file,'utf8');
          assert.equal(text.includes(marker),false,'guard already present');
          const guard=`\n;(()=>{"use strict";const e=document.getElementById("detail-shell");if(!e)return;const t="${marker}";let i=!1;async function a(){const a=new URL(location.href).searchParams.get("strain");if(!a)return;const n=e.querySelector('.detail-public-v1[data-public-detail-id="'+CSS.escape(a)+'"]');if(!n)return;const r=await Promise.resolve(window.__CSWRuntimeCatalogPromise);const s=r?.cultivars?.find(e=>e?.id===a);if(!s)return;for(const[e,i]of[["aroma",s?.aromas?.presentation?.mode],["terpene",s?.terpenes?.presentation?.mode]])if("hidden"===i){n.querySelector('[data-ucd-tab="'+e+'"]')?.remove();n.querySelector('[data-ucd-panel="'+e+'"]')?.remove()}n.dataset.cswHiddenPresentationLiveGuardV1="true"}function n(){i||(i=!0,queueMicrotask(()=>requestAnimationFrame(()=>{i=!1,a().catch(e=>{window.__CSWHiddenPresentationLiveGuardV1Error=String(e?.message||e)})})))}new MutationObserver(n).observe(e,{childList:!0,subtree:!0}),e.addEventListener("click",n,!0),window.addEventListener("popstate",n),n(),setTimeout(n,250),setTimeout(n,1000)})();\n`;
          text+=guard;
          fs.writeFileSync(file,text);
          const after=fs.readFileSync(file,'utf8');
          assert.equal(after.includes(marker),true,'guard append failed');
          assert.equal(after.length,text.length,'unexpected write length');
          console.log(`HIDDEN_PRESENTATION_LIVE_GUARD_APPEND_PASS bytes_added=${guard.length}`);
          NODE
          node --check app.min.js
          git diff --check
          test "$(git diff --name-only)" = "app.min.js"

      - name: Commit candidate with no workflow residue
        shell: bash
        run: |
          set -euo pipefail
          git add app.min.js
          git rm .github/workflows/hidden-presentation-live-guard-temp.yml
          git diff --cached --check
          git config user.name "cannabis-strain-wisdom"
          git config user.email "316430215+cannabis-strain-wisdom@users.noreply.github.com"
          git commit -m "Converge hidden sensory tabs to final runtime state"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "f43c1f8b1ef68b794456fad92d80d91c2bd9fbe9"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "app.min.js"
          git push origin HEAD:candidate/hidden-presentation-live-guard-20260908
          echo "PATCH_SHA=$(git rev-parse HEAD)"
