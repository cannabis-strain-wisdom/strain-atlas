name: Detail interaction recovery cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/detail-interaction-unification-v1-once.yml

permissions:
  contents: write

concurrency:
  group: csw-detail-interaction-unification-recovery
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard recovery scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='25cee718c105eff759f1c087c434f8ff027e2a05'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || {
            echo "SAFE_STOP_EXPECTED_PARENT_MISMATCH expected=$expected_parent actual=$actual_parent" >&2
            exit 42
          }
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = '.github/workflows/detail-interaction-unification-v1-once.yml' || {
            echo "SAFE_STOP_SCOPE_MISMATCH files=$changed" >&2
            exit 43
          }

      - name: Remove failed one-shot safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          trigger_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$remote_sha" = "$trigger_sha" || {
            echo "SAFE_STOP_REMOTE_ADVANCED trigger=$trigger_sha remote=$remote_sha" >&2
            exit 46
          }
          git config user.name 'cannabis-strain-wisdom'
          git config user.email '316430215+cannabis-strain-wisdom@users.noreply.github.com'
          git rm .github/workflows/detail-interaction-unification-v1-once.yml
          git diff --cached --name-only | grep -Fx '.github/workflows/detail-interaction-unification-v1-once.yml'
          git commit -m 'Remove failed detail interaction one-shot'
          git push origin HEAD:main
