name: Search label presentation V1 once

on:
  push:
    branches:
      - validated/search-label-presentation-v1
    paths:
      - .github/workflows/search-label-presentation-v1-once.yml

permissions:
  contents: write

concurrency:
  group: csw-search-label-presentation-v1-once
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='7fcaf9f0ded2e9b21dcf82ecd22e3b1e82d686b2'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || {
            echo "SAFE_STOP_EXPECTED_PARENT_MISMATCH expected=$expected_parent actual=$actual_parent" >&2
            exit 42
          }
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = '.github/workflows/search-label-presentation-v1-once.yml' || {
            echo "SAFE_STOP_CREATION_SCOPE_MISMATCH files=$changed" >&2
            exit 43
          }

      - name: Apply search label presentation only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'csw-search-label-presentation-v1-styles'
          if marker in text:
              raise SystemExit('SAFE_STOP_MARKER_ALREADY_PRESENT')

          required = [
              '<div class="home-search-heading"><span>FIND A CULTIVAR</span><h2 id="search-title">品種を探す</h2></div>',
              '<span>KEYWORD SEARCH</span><strong>キーワード検索</strong>',
              '<div class="filter-group-heading"><span>TYPE</span><h3>タイプ</h3></div>',
              '<div class="filter-group-heading"><span>GENERATION</span><h3>育種世代</h3></div>',
              '<div class="filter-group-heading"><span>CATEGORY</span><h3>特徴カテゴリ</h3></div>',
              '<div class="filter-group-heading"><span>BREEDER</span><h3>ブリーダー</h3></div>',
              '<div class="alphabet-browse-heading"><span>A-Z BROWSE</span></div>',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'SAFE_STOP_EXPECTED_LABEL_STRUCTURE_MISSING:{missing}')

          style = '''\n  <style id="csw-search-label-presentation-v1-styles">\n    .home-search-heading,.keyword-search-summary-copy,.filter-group-heading{display:flex!important;align-items:baseline!important;gap:8px!important}\n    .home-search-heading>span,.keyword-search-summary-copy>span,.filter-group-heading>span,.alphabet-browse-heading>span{color:#d8bd62!important;font-size:10px!important;font-weight:900!important;letter-spacing:.14em!important;line-height:1.2!important}\n    .home-search-heading>h2,.keyword-search-summary-copy>strong,.filter-group-heading>h3{margin:0!important;color:#dfe7e1!important;font-size:14px!important;font-weight:800!important;line-height:1.3!important}\n    .filter-group-heading{justify-content:flex-start!important}\n  </style>\n'''
          count = text.count('</head>')
          if count != 1:
              raise SystemExit(f'SAFE_STOP_HEAD_CLOSE_COUNT:{count}')
          text = text.replace('</head>', style + '</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -Fq 'csw-search-label-presentation-v1-styles' index.html
          grep -Fq '.home-search-heading>h2,.keyword-search-summary-copy>strong,.filter-group-heading>h3' index.html
          grep -Fq '<div class="alphabet-browse-heading"><span>A-Z BROWSE</span></div>' index.html

      - name: Browser regression before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/csw-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep .1
          done
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo 'SAFE_STOP_CHROME_NOT_FOUND' >&2; exit 45; }
          export CHROME_BIN
          export CSW_BASE_URL='http://127.0.0.1:4173/'
          node .github/scripts/public-frontend-browser-smoke-v2.mjs

      - name: Commit exact validated delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cannabis-strain-wisdom'
          git config user.email '316430215+cannabis-strain-wisdom@users.noreply.github.com'
          git rm .github/workflows/search-label-presentation-v1-once.yml
          git add index.html
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/search-label-presentation-v1-once.yml' 'index.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git commit -m 'Unify search bilingual label presentation'
          git push origin HEAD:validated/search-label-presentation-v1
