name: UNIFORM DETAIL CARDS CANDIDATE RUNNER V1

on:
  push:
    branches:
      - candidate/uniform-detail-cards-v1-20260908
    paths:
      - .github/workflows/uniform-detail-cards-candidate-runner-v1.yml
      - .github/scripts/public-detail-card-uniformity-v1.mjs
      - .github/scripts/apply-uniform-detail-cards-candidate-v1.mjs
      - .github/scripts/apply-uniform-primary-cards-candidate-v1.mjs
      - .github/scripts/apply-uniform-lineage-card-candidate-v1.mjs

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard exact PUBLIC base
        shell: bash
        run: |
          set -euo pipefail
          BASE=34cd1e987da104dfd849317b2879902bd7e9ea9a
          git merge-base --is-ancestor "$BASE" HEAD
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo PUBLIC_MAIN_ADVANCED; exit 75; }

      - name: Apply bounded UI patch
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-uniform-detail-cards-candidate-v1.mjs
          node .github/scripts/apply-uniform-primary-cards-candidate-v1.mjs
          node .github/scripts/apply-uniform-lineage-card-candidate-v1.mjs

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.min.js
          node --check presentation-contract-v1.js
          node --check .github/scripts/public-detail-card-uniformity-v1.mjs
          ! grep -Fq 'data-csw-hidden-presentation-live-guard-v1' app.min.js
          grep -Fq 'UNIVERSAL_FIXED_DETAIL_CARDS_V1' presentation-contract-v1.js
          grep -Fq 'UNIVERSAL_FIXED_PRIMARY_CARDS_V1' presentation-contract-v1.js
          grep -Fq 'UNIVERSAL_FIXED_LINEAGE_CARD_V1' presentation-contract-v1.js

      - name: Browser QA for existing behavior and all cultivars
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="${CHROME_BIN:-$(command -v google-chrome || command -v chromium || command -v chromium-browser || command -v google-chrome-stable || true)}"
          test -n "$CHROME_BIN"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/csw-uniform-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-frontend-browser-smoke-v2.mjs
          CHROME_BIN="$CHROME_BIN" CSW_BASE_URL='http://127.0.0.1:4173/' node .github/scripts/public-detail-card-uniformity-v1.mjs

      - name: Seal exact validated files
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/uniform-detail-cards-final"
          mkdir -p "$OUT/.github/scripts" "$OUT/.github/workflows"
          cp app.min.js "$OUT/app.min.js"
          cp presentation-contract-v1.js "$OUT/presentation-contract-v1.js"
          cp .github/scripts/public-detail-card-uniformity-v1.mjs "$OUT/.github/scripts/public-detail-card-uniformity-v1.mjs"
          cp .github/workflows/deploy-public-ui-pages.yml "$OUT/.github/workflows/deploy-public-ui-pages.yml"
          (
            cd "$OUT"
            sha256sum app.min.js presentation-contract-v1.js .github/scripts/public-detail-card-uniformity-v1.mjs .github/workflows/deploy-public-ui-pages.yml > SHA256SUMS
            node - <<'NODE'
          const fs=require('fs');
          const sums=fs.readFileSync('SHA256SUMS','utf8').trim().split(/\n/).map(line=>{const [sha,...rest]=line.trim().split(/\s+/);return {path:rest.join(' '),sha256:sha};});
          fs.writeFileSync('manifest.json',JSON.stringify({schemaVersion:1,publicBaseSha:'34cd1e987da104dfd849317b2879902bd7e9ea9a',qa:'UNIFORM DETAIL CARDS PASS 51/51 x 7 frames',files:sums},null,2)+'\n');
          NODE
          )
          cat "$OUT/SHA256SUMS"

      - name: Upload exact validated file set
        uses: actions/upload-artifact@v4
        with:
          name: uniform-detail-cards-validated-${{ github.run_id }}
          path: ${{ runner.temp }}/uniform-detail-cards-final/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          include-hidden-files: true

      - name: Publish validated non-workflow files to clean candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=34cd1e987da104dfd849317b2879902bd7e9ea9a
          CLEAN_BRANCH=candidate/uniform-detail-cards-clean-v1-20260908
          OUT="$RUNNER_TEMP/uniform-detail-cards-final"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE" || { echo PUBLIC_MAIN_ADVANCED; exit 75; }
          git checkout --detach "$BASE"
          git switch -c "$CLEAN_BRANCH"
          cp "$OUT/app.min.js" app.min.js
          cp "$OUT/presentation-contract-v1.js" presentation-contract-v1.js
          mkdir -p .github/scripts
          cp "$OUT/.github/scripts/public-detail-card-uniformity-v1.mjs" .github/scripts/public-detail-card-uniformity-v1.mjs
          git config user.name cannabis-strain-wisdom
          git config user.email 316430215+cannabis-strain-wisdom@users.noreply.github.com
          git add app.min.js presentation-contract-v1.js .github/scripts/public-detail-card-uniformity-v1.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          test -z "$(git diff --cached --name-only | grep -Ev '^(app\.min\.js|presentation-contract-v1\.js|\.github/scripts/public-detail-card-uniformity-v1\.mjs)$' || true)"
          git diff --cached --check
          git commit -m "Stage validated uniform detail cards"
          git push origin HEAD:"refs/heads/$CLEAN_BRANCH"
